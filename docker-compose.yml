services:
  # ---------------------
  # BACKEND - SPRING BOOT
  # ---------------------
  app:
    build:
      context: ./clouds5spring
      dockerfile: Dockerfile
    container_name: clouds5_spring
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clouds5
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      SPRINGDOC_API_DOCS_PATH: /api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_SWAGGER_UI_ENABLED: true
      SPRINGDOC_SWAGGER_UI_TAGS_SORTER: alpha
      SPRINGDOC_API_DOCS_GROUPS_ENABLED: true
    volumes:
      - ./clouds5spring:/app  # Monte le code source pour les modifications en direct
      - maven_repo:/root/.m2  # Cache Maven pour accélérer les builds
    networks:
      - app-network

  # ---------------------
  # DATABASE - POSTGRES
  # ---------------------
  db:
    image: postgres:16
    container_name: clouds5_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clouds5
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./clouds5spring/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # ---------------------
  # FRONTEND - VUEJS (à compléter plus tard)
  # ---------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - app
  #   networks:
  #     - app-network

networks:
  app-network:

volumes:
  db_data:
  maven_repo: