schemas:
  StandardResponse:
    type: object
    properties:
      statut:
        type: string
        enum: [success, error]
        example: "success"
      data:
        type: object
        nullable: true
      message:
        type: string
        nullable: true
        example: null
  
  ErrorResponse:
    type: object
    properties:
      statut:
        type: string
        example: "error"
      data:
        type: object
        nullable: true
        example: null
      message:
        type: string
        example: "AUTH_001: Identifiants incorrects"
  
  User:
    type: object
    properties:
      id:
        type: integer
        example: 1
      email:
        type: string
        example: "jean@gmail.com"
      nom:
        type: string
        example: "Rigo"
      prenom:
        type: string
        example: "Jean"
      nbrTentative:
        type: integer
        example: 0
      id_userRole:
        type: integer
        example: 2
  
  LoginRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        example: "jean@gmail.com"
      password:
        type: string
        example: "jean123"
  
  RegisterRequest:
    type: object
    required:
      - email
      - nom
      - prenom
      - password
    properties:
      email:
        type: string
        example: "nouveau@gmail.com"
      nom:
        type: string
        example: "Dupont"
      prenom:
        type: string
        example: "Pierre"
      password:
        type: string
        example: "password123"
  
  UpdateUserRequest:
    type: object
    properties:
      nom:
        type: string
        example: "NouveauNom"
      prenom:
        type: string
        example: "NouveauPrenom"
      password:
        type: string
        example: "nouveaupassword"
  
  Signalement:
    type: object
    properties:
      id:
        type: integer
        example: 1
      surface:
        type: number
        format: float
        example: 150.50
      budget:
        type: number
        format: float
        nullable: true
        example: 5000.00
      id_routeEntreprise:
        type: integer
        nullable: true
        example: 1
      id_routeStatus:
        type: integer
        example: 2
      description:
        type: string
        example: "Nid de poule important"
      dateSignalement:
        type: string
        format: date-time
        example: "2024-01-15T10:30:00"
      userId:
        type: integer
        example: 2
      localisation:
        $ref: '#/components/schemas/Localisation'
      entreprise:
        type: string
        example: "Entreprise A"
      status:
        type: string
        example: "nouveau"
  
  Localisation:
    type: object
    properties:
      latitude:
        type: number
        format: float
        example: -18.8792
      longitude:
        type: number
        format: float
        example: 47.5079
  
  NouveauSignalementRequest:
    type: object
    required:
      - latitude
      - longitude
      - description
    properties:
      latitude:
        type: number
        format: float
        example: -18.8792
      longitude:
        type: number
        format: float
        example: 47.5079
      description:
        type: string
        example: "Nid de poule important"
      surface:
        type: number
        format: float
        example: 150.50
  
  UpdateSignalementRequest:
    type: object
    properties:
      surface:
        type: number
        format: float
        example: 160.00
      budget:
        type: number
        format: float
        example: 5500.00
      id_routeEntreprise:
        type: integer
        example: 2
      id_routeStatus:
        type: integer
        example: 3
  
  RecapData:
    type: object
    properties:
      nombrePoints:
        type: integer
        example: 67
      totalSurface:
        type: number
        format: float
        example: 10500.75
      avancementPourcentage:
        type: number
        format: float
        example: 45.5
      totalBudget:
        type: number
        format: float
        example: 250000.00
      parStatus:
        type: object
        properties:
          signale:
            type: integer
            example: 15
          nouveau:
            type: integer
            example: 20
          en_cours:
            type: integer
            example: 22
          termine:
            type: integer
            example: 10
  
  SyncResult:
    type: object
    properties:
      signaleRecuperes:
        type: integer
        example: 15
      signaleEnvoyes:
        type: integer
        example: 10
      nouveauxSignalements:
        type: integer
        example: 5
      signalementsMisAJour:
        type: integer
        example: 8
  
  LoginSuccessData:
    type: object
    properties:
      token:
        type: string
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      user:
        $ref: '#/components/schemas/User'

securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT