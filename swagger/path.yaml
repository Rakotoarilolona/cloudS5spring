/auth/login:
  post:
    tags:
      - Authentification
    summary: Authentification d'un utilisateur
    description: Authentifie un utilisateur avec email et mot de passe. Limite à 3 tentatives.
    operationId: loginUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components.yaml#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Connexion réussie
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    user:
                      id: 1
                      email: "jean@gmail.com"
                      nom: "Rigo"
                      prenom: "Jean"
                      id_userRole: 2
                  message: null
      '401':
        description: Identifiants incorrects
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_001: Identifiants incorrects"
      '403':
        description: Compte bloqué (après 3 tentatives)
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_002: Compte bloqué après 3 tentatives"

/auth/register:
  post:
    tags:
      - Authentification
    summary: Création d'un nouveau compte utilisateur
    description: Inscription d'un nouvel utilisateur avec rôle "utilisateur" par défaut
    operationId: registerUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components.yaml#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: Inscription réussie
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    id: 4
                    email: "nouveau@gmail.com"
                    nom: "Dupont"
                    prenom: "Pierre"
                    nbrTentative: 0
                    id_userRole: 2
                  message: null
      '400':
        description: Email déjà utilisé ou données invalides
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_003: Email déjà utilisé"

/auth/users/{userId}:
  put:
    tags:
      - Authentification
    summary: Modification des informations utilisateur
    description: Met à jour les informations d'un utilisateur (nom, prénom, mot de passe)
    operationId: updateUser
    security:
      - BearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components.yaml#/components/schemas/UpdateUserRequest'
    responses:
      '200':
        description: Modification réussie
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    id: 1
                    email: "jean@gmail.com"
                    nom: "NouveauNom"
                    prenom: "NouveauPrenom"
                    nbrTentative: 0
                    id_userRole: 2
                  message: null
      '401':
        description: Non authentifié
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_005: Token d'authentification manquant ou invalide"
      '404':
        description: Utilisateur non trouvé
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "USER_001: Utilisateur non trouvé"

/auth/users/{userId}/reset-block:
  post:
    tags:
      - Authentification
    summary: Réinitialisation du blocage d'un utilisateur
    description: Réinitialise le compteur de tentatives pour débloquer un compte (manager seulement)
    operationId: resetUserBlock
    security:
      - BearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          example: 1
    responses:
      '200':
        description: Blocage réinitialisé
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    id: 1
                    nbrTentative: 0
                  message: null
      '401':
        description: Non authentifié
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_005: Token d'authentification manquant ou invalide"
      '403':
        description: Permission refusée
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_004: Permission refusée - Manager requis"

/route-problemes:
  get:
    tags:
      - Public
      - Signalements
    summary: Récupérer tous les signalements routiers
    description: Liste tous les signalements (accessible aux visiteurs sans authentification)
    operationId: getAllSignalements
    responses:
      '200':
        description: Liste des signalements
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    signalements:
                      - id: 1
                        surface: 150.50
                        budget: 5000.00
                        id_routeEntreprise: 1
                        id_routeStatus: 2
                        entreprise: "Entreprise A"
                        status: "nouveau"
                        dateSignalement: "2024-01-15T10:30:00"
                        localisation:
                          latitude: -18.8792
                          longitude: 47.5079
                        description: "Nid de poule rue principale"
                      - id: 2
                        surface: 200.00
                        budget: 7500.00
                        id_routeEntreprise: 2
                        id_routeStatus: 3
                        entreprise: "Entreprise B"
                        status: "en cours"
                        dateSignalement: "2024-01-14T14:45:00"
                        localisation:
                          latitude: -18.8800
                          longitude: 47.5085
                        description: "Chaussée déformée"
                  message: null
  post:
    tags:
      - Signalements
    summary: Signaler un nouveau problème routier
    description: Crée un nouveau signalement (utilisateurs authentifiés seulement)
    operationId: createSignalement
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components.yaml#/components/schemas/NouveauSignalementRequest'
    responses:
      '201':
        description: Signalement créé
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    id: 68
                    surface: 150.50
                    budget: null
                    id_routeEntreprise: null
                    id_routeStatus: 1
                    description: "Nid de poule important"
                    localisation:
                      latitude: -18.8792
                      longitude: 47.5079
                    dateSignalement: "2024-01-16T11:30:00"
                    userId: 2
                  message: null
      '401':
        description: Non authentifié
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/ErrorResponse'
            examples:
              error:
                value:
                  statut: "error"
                  data: null
                  message: "AUTH_005: Token d'authentification manquant ou invalide"

/route-problemes/recap:
  get:
    tags:
      - Public
    summary: Tableau de récapitulation actuel
    description: Données statistiques sur les signalements (accessible sans authentification)
    operationId: getRecap
    responses:
      '200':
        description: Données de récapitulation
        content:
          application/json:
            schema:
              $ref: '../components.yaml#/components/schemas/StandardResponse'
            examples:
              success:
                value:
                  statut: "success"
                  data:
                    nombrePoints: 67
                    totalSurface: 10500.75
                    avancementPourcentage: 45.5
                    totalBudget: 250000.00
                    parStatus:
                      signale: 15
                      nouveau: 20
                      en_cours: 22
                      termine: 10
                  message: null

